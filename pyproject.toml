[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imby-process-intelligence"
version = "1.0.0"
description = "IMBY Operation Log Process Mining & Automation Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=10.0.0",
    "spacy>=3.8.0",
    "numpy>=1.24.0",
    "pyrefly>=1.2.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
